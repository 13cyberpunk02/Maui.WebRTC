# coturn on your own computer, only to try TURN before renting a server.
# The secret is public, so stop it when you're done: docker compose -f samples/turn/docker-compose.local.yml down
# Docker Desktop has no host networking, hence the small published port range.

listening-port=3478
min-port=49160
max-port=49200

realm=localhost
use-auth-secret
static-auth-secret=local-development-secret

fingerprint
no-cli
no-tls
no-dtls

log-file=stdout
simple-log
verbose