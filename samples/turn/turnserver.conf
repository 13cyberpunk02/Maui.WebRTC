# coturn for WebRTC calls through Maui.WebRTC. See docs/turn.md for every step.
# Replace each CHANGE_ME, then keep this file readable by root only: it holds the shared secret.

# Ports clients connect to. 3478 serves STUN and TURN over UDP and TCP, 5349 TURN over TLS.
listening-port=3478
tls-listening-port=5349

# Relayed media uses one UDP port per call leg from this range. Open all of it in the firewall.
min-port=49152
max-port=65535

# A cloud VM usually sees only its private address. Give the public one, or public/private:
# external-ip=203.0.113.10
# external-ip=203.0.113.10/10.0.0.5

realm=CHANGE_ME.example.com
server-name=CHANGE_ME.example.com

# Temporary credentials: your server signs them with this secret, coturn checks the signature.
# No password is stored in the app, and a leaked one expires on its own.
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING

# TLS on 5349, for networks that only let HTTPS-like traffic through.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-multicast-peers
stale-nonce=600

# Limits: allocations per user and in total. Raise them as the number of users grows.
user-quota=12
total-quota=1200

# Never relay into private networks: otherwise anyone with credentials could reach machines
# behind this server, including the cloud provider's metadata service.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
